.filters button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:20px 28px 60px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;border-left:3px solid #dbe3f0}
.q.negative{border-left-color:#e03131;background:#fffafa}
.q-top{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-bottom:7px;flex-wrap:wrap}
.id{font-weight:700;color:var(--navy);letter-spacing:.04em}
.cat{text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 6px;border-radius:4px;font-size:9px}
.cat.simple{background:#e3f0fb;color:var(--blue)}
.cat.visual{background:#fff0e6;color:var(--orange)}
.cat.relationship{background:#efeafd;color:var(--purple)}
.cat.cross_document{background:#e6f6ea;color:var(--green)}
.cat.negative{background:#fdecec;color:var(--red)}
.meta{margin-left:auto;font-size:10px;color:var(--muted)}
.q h3{margin:0 0 8px;font-size:13.5px;font-weight:600;line-height:1.45}
.ans{font-size:12.5px;color:#374151;background:#f8fafc;border:1px solid #eef1f6;border-radius:7px;padding:7px 9px}
.ans b{color:var(--navy);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:10px;padding:2px 7px;border-radius:4px;background:#eef2ff;color:var(--navy);border:1px solid #dfe6f5}
.chip.mustnot{background:#fdecec;color:var(--red);border-color:#f5c2c2}
.empty{color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:11px;padding:0 28px 40px;max-width:1180px;margin:0 auto}
@media print{header,.toolbar{position:static}.q{break-inside:avoid}}

        <span class="meta">${(q.expected_docs||[]).join(' + ') || '—'} ${q.expected_pages && q.expected_pages.length ? '· p' + q.expected_pages.join(', p') : ''}</span>

      <h3>${esc(q.question)}</h3>
      <div class="ans"><b>Expected:</b> ${esc(q.expected_answer)}</div>
      ${(q.must_include||[]).length ? `<div class="chips">${q.must_include.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>` : ''}
      ${(q.must_not_include||[]).length ? `<div class="chips">${q.must_not_include.map(m => `<span class="chip mustnot">not: ${esc(m)}</span>`).join('')}</div>` : ''}
    </article>`).join('');
}
document.getElementById('q').oninput = e => { term = e.target.value; render(); };
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  cat = b.dataset.cat;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
  render();
});
counts(); render();
</script></body></html>
